<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div
      class="round"
      style="border: 2px solid #03ADD0; --round-size: 405px"
    ></div>
    <div
      class="round"
      style="
        border: 25px dashed #03ADD0;
        --round-size: 330px;
        --round-period: 20s;
      "
    ></div>
    <div
      class="round"
      style="border: 1px solid #03ADD0; --round-size: 270px;"
    ></div>
    <div
      class="round"
      style="border: 12px dashed #03ADD0; --round-size: 240px; --round-period: 15s reverse"
    ></div>
    <div
      class="round"
      style="border: 8px dashed #03ADD0; --round-size: 180px; --round-period: 10s"
    ></div>
    <div
      class="round"
      style="--round-size: 170px; background-color: #03ADD0;"
    ></div>
  </body>
